name: telyser_app
description: App de campo de Telyser (técnicos, ingenieros y jefe de ruta).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.5.1 <4.0.0"
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  intl: ">=0.19.0 <1.0.0"
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ">=0.9.4 <1.0.0"
  url_launcher: ^6.3.0
  uuid: ^4.6.0
  # Paso 2 (base local y cola): se agregan con
  #   flutter pub add drift sqlite3_flutter_libs path_provider path
  #   flutter pub add --dev drift_dev build_runner

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0"
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/mock/

  fonts:
    - family: Inter
      fonts:
        # - asset: assets\fonts\Inter-VariableFont_opsz,wght.ttf
        # - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800